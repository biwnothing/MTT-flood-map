<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบรายงานน้ำท่วมขังบนผิวจราจร - เมืองทองธานี</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { overflow: hidden; touch-action: none; }
    #map { width: 100vw; height: 100vh; }
    .legend {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 1000;
      font-size: 13px;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
    .color-box { width: 24px; height: 6px; margin-right: 8px; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="legend">
    <div style="font-weight: bold; margin-bottom: 8px;">ระดับน้ำท่วมผิวจราจร</div>
    <div class="legend-item"><span class="color-box" style="background: #28A745;"></span> < 10 ซม. (ปกติ)</div>
    <div class="legend-item"><span class="color-box" style="background: #FFD700;"></span> 10–30 ซม. (รถเล็กสัญจรโดยระมัดระวัง)</div>
    <div class="legend-item"><span class="color-box" style="background: #FF8C00;"></span> 35–40 ซม. (รถเล็กควรเลี่ยงเส้นทาง รถกระบะยกสูงควรสัญจรโดยระมัดระวัง)</div>
    <div class="legend-item"><span class="color-box" style="background: #DC143C;"></span> > 45 ซม. (ปิดจราจร)</div>
  </div>

  <div id="map"></div>

  <script>
    // 1. สร้างแผนที่: เปิดระบบเลื่อนและซูม แต่ดักระดับการซูมไว้
    const map = L.map('map', {
      zoomControl: true,       // เปิดปุ่ม +/-
      dragging: true,          // เปิดการเลื่อนแผนที่ (Pan)
      touchZoom: true,         // เปิดใช้นิ้วถ่างซูม
      scrollWheelZoom: true,   // เปิดลูกกลิ้งเมาส์ซูม
      doubleClickZoom: true,   // เปิดดับเบิลคลิกซูม
      minZoom: 14,             // ล็อคการซูมออก (ไม่ให้เห็นนอกพื้นที่)
      maxZoom: 19              // ล็อคการซูมเข้าสูงสุด
    });

    // 2. กำหนดกรอบเมืองทองธานี (ติวานนท์ - แจ้งวัฒนะ - คลองประปา)
    const muangThongBounds = [
      [13.8880, 100.5100], 
      [13.9350, 100.5650]
    ];

    // 3. ขึงขอบเขตไม่ให้เลื่อนหนีออกไปที่อื่น
    map.setMaxBounds(muangThongBounds);
    
    // 4. ตั้งค่าความแข็งของขอบแผนที่ (1.0 = ชนขอบแล้วหยุดสนิท ไม่เด้งดึ๋งออกไป)
    map.options.maxBoundsViscosity = 1.0;

    // สั่งให้ตอนเปิดมาครั้งแรก ซูมพอดีกับกรอบเมืองทอง
    map.fitBounds(muangThongBounds);

    // ปรับจออัตโนมัติเวลาหมุนโทรศัพท์
    window.addEventListener('resize', () => { 
      map.fitBounds(muangThongBounds); 
    });

    // โหลดแผนที่ฐาน (ฟรี 100%)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ดึงข้อมูล GeoJSON
    async function loadFloodData() {
      try {
        const response = await fetch(`data.geojson?t=${new Date().getTime()}`);
        const data = await response.json();

        L.geoJSON(data, {
          style: function(feature) {
            return {
              color: feature.properties.color,
              weight: 6,
              opacity: 0.85
            };
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              const p = feature.properties;
              const popupContent = `
                <div style="font-size: 13px; line-height: 1.5;">
                  <b style="font-size: 14px;">${p.road_name}</b><br>
                  <b>ระดับน้ำ:</b> ${p.water_depth}<br>
                  <b>สถานะ:</b> <span style="color:${p.color}; font-weight:bold;">${p.status}</span><br>
                  <small style="color: #666;">อัปเดต: ${p.updated}</small>
                </div>
              `;
              layer.bindPopup(popupContent, { autoPan: false });
            }
          }
        }).addTo(map);
      } catch (error) {
        console.error("เกิดข้อผิดพลาดในการโหลดไฟล์ GeoJSON:", error);
      }
    }

    loadFloodData();
  </script>
</body>
</html>
