<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบรายงานน้ำท่วมขังบนผิวจราจร - เมืองทองธานี</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { overflow: hidden; touch-action: none; }
    #map { width: 100vw; height: 100vh; }
    .legend {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 1000;
      font-size: 13px;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
    .color-box { width: 24px; height: 6px; margin-right: 8px; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="legend">
    <div style="font-weight: bold; margin-bottom: 8px;">ระดับน้ำท่วมผิวจราจร</div>
    <div class="legend-item"><span class="color-box" style="background: #28A745;"></span> < 10 ซม. (ปกติ)</div>
    <div class="legend-item"><span class="color-box" style="background: #FFD700;"></span> 10–20 ซม. (ระวัง)</div>
    <div class="legend-item"><span class="color-box" style="background: #FF8C00;"></span> 20–30 ซม. (เลี่ยงเส้นทาง)</div>
    <div class="legend-item"><span class="color-box" style="background: #DC143C;"></span> > 30 ซม. (ปิดจราจร)</div>
  </div>

  <div id="map"></div>

  <script>
    // ล็อคแผนที่และขึงพื้นที่เมืองทองธานี
    const map = L.map('map', {
      zoomControl: false, dragging: false, touchZoom: false,
      doubleClickZoom: false, scrollWheelZoom: false, boxZoom: false, keyboard: false
    });

    const muangThongBounds = [
      [13.8880, 100.5100], 
      [13.9350, 100.5650]  
    ];
    
    map.fitBounds(muangThongBounds);
    map.setMaxBounds(muangThongBounds);

    window.addEventListener('resize', () => {
      map.fitBounds(muangThongBounds);
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ฟังก์ชันดึงข้อมูลจาก Google Sheets (ผ่าน TSV)
    async function loadFloodData() {
      try {
        // วาง URL ที่ลงท้ายด้วย output=tsv ลงในเครื่องหมายคำพูดด้านล่าง
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqm25n5JLGcuK1GkChGuKqjPErKzSpb6E57lnfqVouKxklBa3eda94Hrw5J9VK0p9137H-02ZqN8DZ/pub?gid=0&single=true&output=tsv';
        
        // ต่อท้ายด้วยเวลาเพื่อกันเบราว์เซอร์จำข้อมูลเก่า
        const response = await fetch(`${sheetURL}&t=${new Date().getTime()}`);
        const tsvText = await response.text();

        // แยกข้อมูลเป็นรายบรรทัด
        const rows = tsvText.split('\n');
        const features = [];

        // เริ่มอ่านบรรทัดที่ 2 (i=1) เพื่อข้ามหัวตาราง
        for (let i = 1; i < rows.length; i++) {
          // แยกข้อมูลคอลัมน์ด้วย Tab
          const cols = rows[i].split('\t');

          // ถ้าบรรทัดนี้ข้อมูลไม่ครบ 4 ช่อง ให้ข้าม
          if (cols.length < 4) continue;

          const location = cols[0].trim();
          const description = cols[1].trim();
          const color = cols[2].trim();
          const coordsString = cols[3].trim();

          // ลอจิกดักแหว่ง: ถ้ามีช่องใดช่องหนึ่งเว้นว่างไว้ ให้ข้ามไปเงียบๆ ทันที
          if (!location || !description || !color || !coordsString) continue;

          try {
            // ลองแปลงพิกัด ถ้าพิกัดใส่วงเล็บผิด มันจะจับ Error แล้วข้ามไป ไม่ทำให้เว็บค้าง
            const coords = JSON.parse(coordsString);
            
            features.push({
              "type": "Feature",
              "properties": {
                "location": location,
                "description": description,
                "color": color
              },
              "geometry": {
                "type": "LineString",
                "coordinates": coords
              }
            });
          } catch (e) {
            continue;
          }
        }

        // สร้างเป็นข้อมูลแผนที่
        const geoJsonData = {
          "type": "FeatureCollection",
          "features": features
        };

        // วาดเส้นลงแผนที่
        L.geoJSON(geoJsonData, {
          style: function(feature) {
            return {
              color: feature.properties.color,
              weight: 6,
              opacity: 0.85
            };
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              const p = feature.properties;
              const popupContent = `
                <div style="font-size: 13px; line-height: 1.5;">
                  <b style="font-size: 14px;">${p.location}</b><br>
                  <b>สถานะ:</b> <span style="color:${p.color}; font-weight:bold;">${p.description}</span>
                </div>
              `;
              layer.bindPopup(popupContent, { autoPan: false });
            }
          }
        }).addTo(map);

      } catch (error) {
        console.error("ระบบไม่สามารถดึงข้อมูลได้:", error);
      }
    }

    loadFloodData();
  </script>
</body>
</html>
