<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบรายงานน้ำท่วมขังบนผิวจราจร - เมืองทองธานี</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { overflow: hidden; touch-action: none; }
    #map { width: 100vw; height: 100vh; }
    .legend {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 1000;
      font-size: 13px;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
    .color-box { width: 24px; height: 6px; margin-right: 8px; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="legend">
    <div style="font-weight: bold; margin-bottom: 8px;">ระดับน้ำท่วมผิวจราจร</div>
    <div class="legend-item"><span class="color-box" style="background: #28A745;"></span> < 10 ซม. (ปกติ)</div>
    <div class="legend-item"><span class="color-box" style="background: #FFD700;"></span> 10–20 ซม. (ระวัง)</div>
    <div class="legend-item"><span class="color-box" style="background: #FF8C00;"></span> 20–30 ซม. (เลี่ยงเส้นทาง)</div>
    <div class="legend-item"><span class="color-box" style="background: #DC143C;"></span> > 30 ซม. (ปิดจราจร)</div>
  </div>

  <div id="map"></div>

  <script>
    // 1. ล็อคแผนที่ ไม่ให้เลื่อนหรือซูมหนีออกไปที่อื่น
    const map = L.map('map', {
      zoomControl: false, dragging: false, touchZoom: false,
      doubleClickZoom: false, scrollWheelZoom: false, boxZoom: false, keyboard: false
    });

    // 2. กำหนดกรอบพื้นที่ใหม่ (ครอบคลุม ติวานนท์ - แจ้งวัฒนะ - คลองประปา)
    const muangThongBounds = [
      [13.8880, 100.5100], // มุมล่างซ้าย: คลุมแยกปากเกร็ด / ถนนติวานนท์ตัดแจ้งวัฒนะ
      [13.9350, 100.5650]  // มุมบนขวา: คลุมแนวคลองประปา / แยกศรีสมาน
    ];
    
    // บังคับแผนที่ให้อยู่ในกรอบเสมอ
    map.fitBounds(muangThongBounds);
    map.setMaxBounds(muangThongBounds);

    // ปรับสัดส่วนอัตโนมัติเมื่อหมุนหน้าจอโทรศัพท์
    window.addEventListener('resize', () => {
      map.fitBounds(muangThongBounds);
    });

    // 3. เรียกแผนที่ฐานจาก OpenStreetMap (ฟรี)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 4. ดึงข้อมูลจาก API (Google Sheets)
    async function loadFloodData() {
      try {
        // นำ URL ที่ได้จากการ Deploy Web App ใน Google Apps Script มาใส่ในเครื่องหมายคำพูดด้านล่าง
        const sheetURL = 'https://script.google.com/macros/s/AKfycbyDd-ND7hZU9NIOLKg1xLJhsvkr9O0FIYw-u9hiRkhg2eUy_2cVH6rapCygHgmNo0Pmaw/exec';
        
        const response = await fetch(sheetURL);
        const simpleData = await response.json();

        // แปลงข้อมูลที่ได้จาก Sheets เป็น GeoJSON
        const geoJsonData = {
          "type": "FeatureCollection",
          "features": simpleData.map(item => ({
            "type": "Feature",
            "properties": {
              "location": item.location,
              "description": item.description,
              "color": item.color
            },
            "geometry": {
              "type": "LineString",
              "coordinates": item.coords
            }
          }))
        };

        // 5. วาดเส้นและตั้งค่า Pop-up
        L.geoJSON(geoJsonData, {
          style: function(feature) {
            return {
              color: feature.properties.color,
              weight: 6,
              opacity: 0.85
            };
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              const p = feature.properties;
              
              const popupContent = `
                <div style="font-size: 13px; line-height: 1.5;">
                  <b style="font-size: 14px;">${p.location}</b><br>
                  <b>สถานะ:</b> <span style="color:${p.color}; font-weight:bold;">${p.description}</span><br>
                  <small style="color: #666;">ข้อมูลอัปเดตล่าสุด</small>
                </div>
              `;
              layer.bindPopup(popupContent, { autoPan: false });
            }
          }
        }).addTo(map);
      } catch (error) {
        console.error("เกิดข้อผิดพลาดในการโหลดข้อมูลน้ำท่วม:", error);
      }
    }

    // เรียกฟังก์ชันเริ่มทำงาน
    loadFloodData();
  </script>
</body>
</html>
