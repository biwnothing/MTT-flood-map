<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบรายงานน้ำท่วมขังบนผิวจราจร - เมืองทองธานี</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    /* ล็อค body ไม่ให้เลื่อนหน้าจอได้ */
    body { overflow: hidden; touch-action: none; }
    #map { width: 100vw; height: 100vh; }
    .legend {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 1000;
      font-size: 13px;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
    .color-box { width: 24px; height: 6px; margin-right: 8px; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="legend">
    <div style="font-weight: bold; margin-bottom: 8px;">ระดับน้ำท่วมผิวจราจร</div>
    <div class="legend-item"><span class="color-box" style="background: #28A745;"></span> < 10 ซม. (ปกติ)</div>
    <div class="legend-item"><span class="color-box" style="background: #FFD700;"></span> 10–20 ซม. (ระวัง)</div>
    <div class="legend-item"><span class="color-box" style="background: #FF8C00;"></span> 20–30 ซม. (เลี่ยงเส้นทาง)</div>
    <div class="legend-item"><span class="color-box" style="background: #DC143C;"></span> > 30 ซม. (ปิดจราจร)</div>
  </div>

  <div id="map"></div>

  <script>
    // 1. ตั้งค่าปิดการควบคุมแผนที่ทุกชนิด (ล็อคแผนที่)
    const map = L.map('map', {
      zoomControl: false,       // ซ่อนปุ่มซูม +/-
      dragging: false,          // ห้ามลากแผนที่
      touchZoom: false,         // ห้ามซูมด้วยนิ้ว (Pinch to zoom)
      doubleClickZoom: false,   // ห้ามดับเบิลคลิกเพื่อซูม
      scrollWheelZoom: false,   // ห้ามซูมด้วยลูกกลิ้งเมาส์
      boxZoom: false,           // ห้ามซูมด้วยการลากกล่อง
      keyboard: false           // ห้ามเลื่อนแผนที่ด้วยคีย์บอร์ด
    });

    // 2. กำหนดกรอบพื้นที่ (Bounding Box) ของเมืองทองธานี
    // พิกัด: [มุมล่างซ้าย (SouthWest), มุมบนขวา (NorthEast)]
    const muangThongBounds = [
      [13.8950, 100.5280], // ล่างซ้าย: แถวทางเข้าฝั่งแจ้งวัฒนะ/ติวานนท์
      [13.9220, 100.5550]  // บนขวา: แถวริมทะเลสาบ/ทางด่วน
    ];

    // บังคับให้แผนที่แสดงผลพอดีกับกรอบพื้นที่นี้เสมอ
    map.fitBounds(muangThongBounds);
    
    // ตั้งข้อจำกัดไม่ให้แผนที่หลุดออกนอกกรอบนี้
    map.setMaxBounds(muangThongBounds);

    // 3. ปรับขนาดแผนที่อัตโนมัติเมื่อหมุนจอโทรศัพท์ หรือย่อขยายหน้าต่างเบราว์เซอร์
    window.addEventListener('resize', () => {
      map.fitBounds(muangThongBounds);
    });

    // 4. แผนที่ฐานจาก OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 5. ดึงข้อมูล GeoJSON
    async function loadFloodData() {
      try {
        const response = await fetch(`data.geojson?t=${new Date().getTime()}`);
        const data = await response.json();

        L.geoJSON(data, {
          style: function(feature) {
            return {
              color: feature.properties.color,
              weight: 6,
              opacity: 0.85
            };
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              const p = feature.properties;
              const popupContent = `
                <div style="font-size: 13px; line-height: 1.5;">
                  <b style="font-size: 14px;">${p.road_name}</b><br>
                  <b>ระดับน้ำ:</b> ${p.water_depth}<br>
                  <b>สถานะ:</b> <span style="color:${p.color}; font-weight:bold;">${p.status}</span><br>
                  <small style="color: #666;">อัปเดต: ${p.updated}</small>
                </div>
              `;
              // ตั้งค่า autoPan: false เพื่อไม่ให้แผนที่พยายามขยับตามเวลาผู้ใช้คลิก Pop-up
              layer.bindPopup(popupContent, { autoPan: false });
            }
          }
        }).addTo(map);
      } catch (error) {
        console.error("เกิดข้อผิดพลาดในการโหลดข้อมูลน้ำท่วม:", error);
      }
    }

    loadFloodData();
  </script>
</body>
</html>
