<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรายงานน้ำท่วมขังบนผิวจราจร</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .legend {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      z-index: 1000;
      font-size: 13px;
    }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
    .color-box { width: 24px; height: 6px; margin-right: 8px; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="legend">
    <div style="font-weight: bold; margin-bottom: 8px;">ระดับน้ำท่วมผิวจราจร</div>
    <div class="legend-item"><span class="color-box" style="background: #FFD700;"></span> 10–20 ซม. (รถเล็กระวัง)</div>
    <div class="legend-item"><span class="color-box" style="background: #FF8C00;"></span> 20–30 ซม. (รถเล็กห้ามผ่าน)</div>
    <div class="legend-item"><span class="color-box" style="background: #DC143C;"></span> > 30 ซม. (ปิดการจราจร)</div>
  </div>

  <div id="map"></div>

  <script>
    // 1. กำหนดพิกัดเริ่มต้น และ Zoom Level
    const map = L.map('map').setView([13.9100, 100.5480], 14);

    // 2. ใช้แผนที่ฐานจาก OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3. ฟังก์ชันดึงข้อมูลจากไฟล์ data.geojson แบบป้องกันการติด Cache
    async function loadFloodData() {
      try {
        // เพิ่ม ?t=เวลาปัจจุบัน เพื่อบังคับให้ Browser โหลดไฟล์ใหม่เสมอ ไม่ดึงของเก่าจาก Cache
        const response = await fetch(`data.geojson?t=${new Date().getTime()}`);
        const data = await response.json();

        // 4. วาดเส้นลงบนแผนที่
        L.geoJSON(data, {
          style: function(feature) {
            return {
              color: feature.properties.color,
              weight: 6,
              opacity: 0.85
            };
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              const p = feature.properties;
              const popupContent = `
                <div style="font-size: 13px; line-height: 1.5;">
                  <b style="font-size: 14px;">${p.road_name}</b><br>
                  <b>ระดับน้ำ:</b> ${p.water_depth}<br>
                  <b>สถานะ:</b> <span style="color:${p.color}; font-weight:bold;">${p.status}</span><br>
                  <small style="color: #666;">อัปเดต: ${p.updated}</small>
                </div>
              `;
              layer.bindPopup(popupContent);
            }
          }
        }).addTo(map);
      } catch (error) {
        console.error("เกิดข้อผิดพลาดในการโหลดข้อมูลน้ำท่วม:", error);
      }
    }

    // เรียกใช้งานฟังก์ชัน
    loadFloodData();
  </script>
</body>
</html>
